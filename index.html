<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ex-Hangover Year Draw</title>
<style>
  /* Toolbox dark palette (Toolbox_extension/Toolbox.py, body.dark) */
  :root { --page: #1c1c1e; --panel: #1e3320; --line: #2d4a30; --inset: #162a19; --text: #d4c9a8; --soft: #b8c9a8; --muted: #7a9e7e; --accent: #3a7d54; --accent-hover: #2e6644; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body { font-family: system-ui, sans-serif; background: var(--page); color: var(--text); }
  .container { padding: 1.5rem 1rem; max-width: 480px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 1.5rem; }
  .header h2 { font-size: 20px; font-weight: 500; color: var(--text); }
  .header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .status { text-align: center; font-size: 14px; color: var(--soft); margin-bottom: 1rem; min-height: 1.3em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
  .player-card { background: var(--inset); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .player-card:last-child { margin-bottom: 0; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: var(--muted); flex-shrink: 0; }
  .avatar.rolled { background: var(--accent); color: #eaf3de; border-color: #5a8a5e; }
  .player-info { flex: 1; min-width: 0; }
  .player-name-static { font-size: 14px; font-weight: 500; color: var(--text); }
  .player-result { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .player-result.revealed { color: var(--soft); font-weight: 500; }
  .roll-btn { padding: 7px 16px; min-height: 44px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: system-ui, sans-serif; }
  .roll-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .roll-btn:focus-visible, .copy-btn:focus-visible { outline: 2px solid var(--soft); outline-offset: 2px; }
  .roll-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .year-badge { padding: 0 12px; height: 36px; border-radius: 18px; background: var(--accent); color: #eaf3de; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chat-log { background: #242426; border: 1px solid #2f2f32; border-radius: 12px; padding: 1rem; margin-top: 1.5rem; }
  .chat-log-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .log-entry { font-size: 13px; color: var(--text); padding: 5px 0; border-bottom: 1px solid #2f2f32; }
  .log-entry:last-child { border-bottom: none; }
  .log-empty { font-size: 13px; color: #8a8a8e; font-style: italic; }
  .final-banner { background: var(--panel); border: 1px solid #5a8a5e; border-radius: 12px; padding: 1rem 1.25rem; margin-top: 1rem; text-align: center; }
  .final-banner p { font-size: 14px; color: var(--text); font-weight: 500; }
  .final-list { margin-top: 8px; font-size: 13px; font-weight: 400; color: var(--soft); line-height: 1.7; }
  .copy-btn { margin-top: 12px; padding: 8px 20px; min-height: 44px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: system-ui, sans-serif; }
  .copy-btn:hover { background: var(--accent-hover); }
  .note { margin-top: 8px; font-size: 13px; color: var(--soft); }
  @media (max-width: 360px) {
    .container { padding: 1.25rem 0.75rem; }
    .player-card { padding: 0.85rem 1rem; }
    .avatar { width: 36px; height: 36px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>Ex-Hangover Year Draw</h2>
    <p>Every roll is final.</p>
    <p>6 players — 6 years (2026–2031) — one roll each.</p>
  </div>
  <p class="status" id="status">Loading the draw...</p>
  <div class="panel" id="players-container"></div>
  <div class="chat-log">
    <div class="chat-log-title">Roll log</div>
    <div id="log-container"><p class="log-empty">Waiting for first roll...</p></div>
  </div>
  <div id="final-section" style="display:none">
    <div class="final-banner">
      <p>All years assigned!</p>
      <div class="final-list" id="final-list"></div>
      <button class="copy-btn" id="copy">Copy results for Viber</button>
      <p class="note" id="note"></p>
    </div>
  </div>
</div>
<script>
  const NAMES = ['PB', 'Ashok', 'Karma Tashi', 'Tapa dai', 'Karma Y', 'Karma Wangdi'];
  const START_YEAR = 2026;
  const YEARS = NAMES.map((_, i) => START_YEAR + i);
  // Shared draw: the database only accepts each name once and each year once,
  // and only with that person's secret key. Reset is admin-only (firebase CLI).
  const ROOT = 'https://taas-bbq-year-draw-default-rtdb.asia-southeast1.firebasedatabase.app';
  const DB = ROOT + '/draw';
  // Personal link: #me=<index>&k=<key>. The hash never reaches the web server.
  const LINK = new URLSearchParams(location.hash.slice(1));
  const ME = NAMES[Number(LINK.get('me'))] && LINK.get('k') ? NAMES[Number(LINK.get('me'))] : null;
  const KEY = LINK.get('k');

  let names = {}, log = [], isRolling = false, isLoaded = false;
  const $ = id => document.getElementById(id);
  const yearOf = name => names[name] ? Number(names[name]) : null;
  const setStatus = text => { $('status').textContent = text; };

  async function refresh() {
    let next;
    try {
      const res = await fetch(DB + '/names.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      next = (await res.json()) || {};
    } catch {
      setStatus("Can't reach the draw. Check your internet and reload the page.");
      return;
    }
    const added = NAMES.filter(n => next[n] && !names[n]);
    const isFirstLoad = !isLoaded;
    names = next;
    isLoaded = true;
    if (isRolling) return;
    added.forEach(n => log.push(n + (isFirstLoad ? ' → ' : ' rolled → ') + names[n]));
    if (isFirstLoad) setStatus(firstLoadStatus(added.length));
    else if (added.length) setStatus(added.map(n => n + ' got ' + names[n] + '.').join(' '));
    render();
  }

  function firstLoadStatus(rolledCount) {
    const progress = rolledCount ? rolledCount + ' of 6 have rolled. ' : '';
    if (!ME) return progress + 'View only. To roll, open your personal link from Karma Y on Viber.';
    if (yearOf(ME) !== null) return progress + 'You rolled ' + yearOf(ME) + '.';
    return progress + 'Hi ' + ME + ', tap Roll when you are ready.';
  }

  // ponytail: no auto-assign for the last person; that would mean rolling without their key.
  async function roll() {
    if (!ME || isRolling || !isLoaded || yearOf(ME) !== null) return;
    const taken = new Set(Object.values(names).map(Number));
    const available = YEARS.filter(y => !taken.has(y));
    const year = available[Math.floor(Math.random() * available.length)];
    const update = { ['draw/years/' + year]: ME, ['draw/names/' + ME]: String(year), ['proofs/' + ME]: KEY };

    isRolling = true;
    setStatus(ME + ' is rolling...');
    render();
    const isSaved = await fetch(ROOT + '/.json', { method: 'PATCH', body: JSON.stringify(update) }).then(r => r.ok, () => false);
    isRolling = false;

    if (!isSaved) {
      await refresh();
      const wasCollision = yearOf(ME) === null && NAMES.some(n => yearOf(n) === year);
      setStatus(wasCollision
        ? "That roll didn't count: someone rolled at the same moment. Tap Roll again."
        : "This link can't roll. Ask Karma Y to resend your personal link.");
      render();
      return;
    }
    names = { ...names, [ME]: String(year) };
    log.push(ME + ' rolled → ' + year);
    setStatus(ME + ' gets ' + year + '.');
    render();
  }

  function playerCard(name) {
    const year = yearOf(name);
    const card = document.createElement('div');
    card.className = 'player-card';
    const av = document.createElement('div');
    av.className = 'avatar' + (year ? ' rolled' : '');
    av.textContent = name[0].toUpperCase();
    const info = document.createElement('div');
    info.className = 'player-info';
    const nm = document.createElement('div');
    nm.className = 'player-name-static';
    nm.textContent = name;
    const res = document.createElement('div');
    res.className = 'player-result' + (year ? ' revealed' : '');
    res.textContent = year ? 'Rolled!' : 'Waiting to roll...';
    info.append(nm, res);
    card.append(av, info);
    if (year) {
      const badge = document.createElement('div');
      badge.className = 'year-badge';
      badge.textContent = year;
      card.appendChild(badge);
    } else if (name === ME) {
      const btn = document.createElement('button');
      btn.className = 'roll-btn';
      btn.textContent = 'Roll';
      btn.disabled = isRolling || !isLoaded;
      btn.onclick = roll;
      card.appendChild(btn);
    }
    return card;
  }

  function summaryLines() {
    return YEARS.map(y => y + ' — ' + NAMES.find(n => yearOf(n) === y));
  }

  function render() {
    $('players-container').replaceChildren(...NAMES.map(playerCard));
    const logContainer = $('log-container');
    if (log.length === 0) {
      logContainer.innerHTML = '<p class="log-empty">Waiting for first roll...</p>';
    } else {
      logContainer.replaceChildren(...log.map(entry => {
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.textContent = entry;
        return div;
      }));
    }
    const isDone = NAMES.every(n => yearOf(n) !== null);
    $('final-section').style.display = isDone ? 'block' : 'none';
    if (isDone) {
      $('final-list').innerHTML = summaryLines().join('<br>');
      setStatus('All six years are drawn.');
    }
  }

  $('copy').onclick = () => navigator.clipboard.writeText('Ex-Hangover year draw results\n' + summaryLines().join('\n'))
    .then(() => { $('note').textContent = 'Copied. Paste it in the Viber group.'; })
    .catch(() => { $('note').textContent = 'Copying is blocked here. Press and hold the list above to copy it.'; });

  render();
  refresh();
  // ponytail: any server change triggers one re-read; fine for 6 people.
  const stream = new EventSource(DB + '.json');
  ['put', 'patch'].forEach(type => stream.addEventListener(type, refresh));
</script>
</body>
</html>
