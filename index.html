<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taas and BBQ Year Draw</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fff; color: #111; }
  .container { padding: 1.5rem 1rem; max-width: 480px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 1.5rem; }
  .header h2 { font-size: 20px; font-weight: 500; color: #111; }
  .header p { font-size: 13px; color: #666; margin-top: 4px; }
  .status { text-align: center; font-size: 14px; color: #111; margin-bottom: 1rem; min-height: 1.3em; }
  .player-card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #f3f3f3; border: 0.5px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #666; flex-shrink: 0; }
  .avatar.rolled { background: #EAF3DE; color: #27500A; border-color: #C0DD97; }
  .player-info { flex: 1; }
  .player-name-static { font-size: 14px; font-weight: 500; color: #111; }
  .player-result { font-size: 13px; color: #666; margin-top: 2px; }
  .player-result.revealed { color: #3B6D11; font-weight: 500; }
  .roll-btn { padding: 7px 16px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #111; font-size: 14px; cursor: pointer; white-space: nowrap; font-family: system-ui, sans-serif; }
  .roll-btn:hover:not(:disabled) { background: #f3f3f3; }
  .roll-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .year-badge { padding: 0 12px; height: 36px; border-radius: 18px; background: #3B6D11; color: #EAF3DE; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chat-log { background: #f8f8f8; border-radius: 12px; padding: 1rem; margin-top: 1.5rem; }
  .chat-log-title { font-size: 12px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .log-entry { font-size: 13px; color: #111; padding: 5px 0; border-bottom: 0.5px solid #e5e5e5; }
  .log-entry:last-child { border-bottom: none; }
  .log-empty { font-size: 13px; color: #999; font-style: italic; }
  .final-banner { background: #EAF3DE; border: 0.5px solid #C0DD97; border-radius: 12px; padding: 1rem 1.25rem; margin-top: 1rem; text-align: center; }
  .final-banner p { font-size: 14px; color: #27500A; font-weight: 500; }
  .final-list { margin-top: 8px; font-size: 13px; font-weight: 400; color: #27500A; line-height: 1.7; }
  .copy-btn { margin-top: 12px; padding: 8px 20px; border-radius: 8px; border: 0.5px solid #C0DD97; background: #EAF3DE; color: #27500A; font-size: 14px; cursor: pointer; font-family: system-ui, sans-serif; }
  .copy-btn:hover { background: #C0DD97; }
  .note { margin-top: 8px; font-size: 13px; color: #27500A; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>Taas and BBQ Year Draw</h2>
    <p>6 players — 6 years (2026–2031) — one roll each. Tap Roll on your own name only; every roll is final.</p>
  </div>
  <p class="status" id="status">Loading the draw...</p>
  <div id="players-container"></div>
  <div class="chat-log">
    <div class="chat-log-title">Roll log</div>
    <div id="log-container"><p class="log-empty">Waiting for first roll...</p></div>
  </div>
  <div id="final-section" style="display:none">
    <div class="final-banner">
      <p>All years assigned!</p>
      <div class="final-list" id="final-list"></div>
      <button class="copy-btn" id="copy">Copy results for Viber</button>
      <p class="note" id="note"></p>
    </div>
  </div>
</div>
<script>
  const NAMES = ['PB', 'Ashok', 'Karma Tashi', 'Tapa dai', 'Karma Y', 'Karma Wangdi'];
  const START_YEAR = 2026;
  const YEARS = NAMES.map((_, i) => START_YEAR + i);
  // Shared draw: the database only accepts each name once and each year once. Reset is admin-only (firebase CLI).
  const DB = 'https://taas-bbq-year-draw-default-rtdb.asia-southeast1.firebasedatabase.app/draw';

  let names = {}, log = [], isRolling = false, isLoaded = false;
  const $ = id => document.getElementById(id);
  const yearOf = name => names[name] ? Number(names[name]) : null;
  const setStatus = text => { $('status').textContent = text; };

  async function refresh() {
    let next;
    try {
      const res = await fetch(DB + '/names.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      next = (await res.json()) || {};
    } catch {
      setStatus("Can't reach the draw. Check your internet and reload the page.");
      return;
    }
    const added = NAMES.filter(n => next[n] && !names[n]);
    const isFirstLoad = !isLoaded;
    names = next;
    isLoaded = true;
    if (isRolling) return;
    added.forEach(n => log.push(n + (isFirstLoad ? ' → ' : ' rolled → ') + names[n]));
    if (isFirstLoad) setStatus(added.length ? added.length + ' of 6 have rolled.' : 'Tap Roll on your name.');
    else if (added.length) setStatus(added.map(n => n + ' got ' + names[n] + '.').join(' '));
    render();
  }

  async function roll(name) {
    if (isRolling || !isLoaded || yearOf(name) !== null) return;
    const taken = new Set(Object.values(names).map(Number));
    const available = YEARS.filter(y => !taken.has(y));
    const year = available[Math.floor(Math.random() * available.length)];
    const update = { ['years/' + year]: name, ['names/' + name]: String(year) };
    const others = NAMES.filter(n => n !== name && yearOf(n) === null);
    const isSecondLast = others.length === 1 && available.length === 2;
    const lastYear = available.find(y => y !== year);
    if (isSecondLast) Object.assign(update, { ['years/' + lastYear]: others[0], ['names/' + others[0]]: String(lastYear) });

    isRolling = true;
    setStatus(name + ' is rolling...');
    render();
    const isSaved = await fetch(DB + '.json', { method: 'PATCH', body: JSON.stringify(update) }).then(r => r.ok, () => false);
    isRolling = false;

    if (!isSaved) {
      setStatus("That roll didn't count: someone rolled at the same moment. Tap Roll again.");
      await refresh();
      render();
      return;
    }
    names = { ...names, [name]: String(year) };
    log.push(name + ' rolled → ' + year);
    if (isSecondLast) {
      names = { ...names, [others[0]]: String(lastYear) };
      log.push(others[0] + ' → auto-assigned ' + lastYear);
    }
    setStatus(name + ' gets ' + year + '.');
    render();
  }

  function playerCard(name) {
    const year = yearOf(name);
    const card = document.createElement('div');
    card.className = 'player-card';
    const av = document.createElement('div');
    av.className = 'avatar' + (year ? ' rolled' : '');
    av.textContent = name[0].toUpperCase();
    const info = document.createElement('div');
    info.className = 'player-info';
    const nm = document.createElement('div');
    nm.className = 'player-name-static';
    nm.textContent = name;
    const res = document.createElement('div');
    res.className = 'player-result' + (year ? ' revealed' : '');
    res.textContent = year ? 'Rolled!' : 'Waiting to roll...';
    info.append(nm, res);
    card.append(av, info);
    if (year) {
      const badge = document.createElement('div');
      badge.className = 'year-badge';
      badge.textContent = year;
      card.appendChild(badge);
    } else {
      const btn = document.createElement('button');
      btn.className = 'roll-btn';
      btn.textContent = 'Roll';
      btn.disabled = isRolling || !isLoaded;
      btn.onclick = () => roll(name);
      card.appendChild(btn);
    }
    return card;
  }

  function summaryLines() {
    return YEARS.map(y => y + ' — ' + NAMES.find(n => yearOf(n) === y));
  }

  function render() {
    $('players-container').replaceChildren(...NAMES.map(playerCard));
    const logContainer = $('log-container');
    if (log.length === 0) {
      logContainer.innerHTML = '<p class="log-empty">Waiting for first roll...</p>';
    } else {
      logContainer.replaceChildren(...log.map(entry => {
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.textContent = entry;
        return div;
      }));
    }
    const isDone = NAMES.every(n => yearOf(n) !== null);
    $('final-section').style.display = isDone ? 'block' : 'none';
    if (isDone) {
      $('final-list').innerHTML = summaryLines().join('<br>');
      setStatus('All six years are drawn.');
    }
  }

  $('copy').onclick = () => navigator.clipboard.writeText('Taas and BBQ year draw results\n' + summaryLines().join('\n'))
    .then(() => { $('note').textContent = 'Copied. Paste it in the Viber group.'; })
    .catch(() => { $('note').textContent = 'Copying is blocked here. Press and hold the list above to copy it.'; });

  render();
  refresh();
  // ponytail: any server change triggers one re-read; fine for 6 people.
  const stream = new EventSource(DB + '.json');
  ['put', 'patch'].forEach(type => stream.addEventListener(type, refresh));
</script>
</body>
</html>
